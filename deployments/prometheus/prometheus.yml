global:
  scrape_interval: 5s
scrape_configs:
  - job_name: processor
    dns_sd_configs:                 # discovers every scaled replica via Compose DNS
      - { names: [processor], type: A, port: 9100 }
  - job_name: producer
    static_configs: [{ targets: ["producer:8081"] }]
  - job_name: api
    static_configs: [{ targets: ["api:8080"] }]
